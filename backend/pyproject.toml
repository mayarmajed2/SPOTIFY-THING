[project]
name = "resonance-music-engine"
version = "1.0.0"
description = "Resonance — Intelligent Music Recommendation and Adaptive Shuffle System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.26.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pyarrow>=18.0.0",
    "pytest>=8.3.0",
    "scipy>=1.14.0",
    "tqdm>=4.66.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.setuptools.packages.find]
include = ["app*", "training*", "data_pipeline*"]

[tool.pytest.ini_options]
markers = [
    "requires_dataset: integration tests requiring locally built data/processed parquet files and checkpoints",
]
