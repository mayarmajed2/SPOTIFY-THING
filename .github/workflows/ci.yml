name: CI — Backend Tests & Frontend Build

on:
  push:
    branches: [main, "feat/**", "research/**"]
  pull_request:
    branches: [main]

jobs:
  backend-unit-tests:
    name: Backend Unit & Persistence Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch and backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./backend

      - name: Run unit and persistence tests (excluding dataset-dependent E2E)
        # Note: backend/tests/test_api_e2e.py is marked @pytest.mark.requires_dataset
        # because it tests against locally generated 40k-track Parquet tables and
        # trained checkpoints (~800 MB) not committed to Git. It is intentionally
        # deselected in CI via `-m "not requires_dataset"` rather than skipped silently.
        env:
          PYTHONPATH: "."
        run: pytest backend/tests -m "not requires_dataset" -v

  frontend-build:
    name: Frontend TypeScript & Next.js Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
